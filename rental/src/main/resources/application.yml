spring:
  application:
    name: Bike Rental
  datasource:
    url: jdbc:postgresql://localhost:5412/axoniq_build_db
    username: axon_user
    password: axon_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

